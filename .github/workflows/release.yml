name: Create Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

# Keep release/deploy jobs ordered; do not interrupt an in-flight deployment.
concurrency:
  group: production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Bun
        run: npm install -g bun@1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check guidelines formatting
        run: bun run format-check:guidelines

      - name: Verify accepted decision bank and archived evidence
        run: |
          bun run decisions validate
          node verification/decisions/verify.mjs

      - name: Build Release Files
        run: bun run buildRelease.ts

      - name: Create Release
        id: create_release
        uses: rymndhng/release-on-push-action@master
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          bump_version_scheme: minor
          tag_prefix: v
          release_name: "Release <RELEASE_VERSION>"

      - name: Upload Release Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for file in dist/*; do
            if [ -f "$file" ]; then
              gh release upload "${{ steps.create_release.outputs.tag_name }}" "$file" --clobber
            fi
          done

      - name: Install evalScores dependencies
        working-directory: evalScores
        run: bun install --frozen-lockfile

      - name: Run lint
        run: bun run lint

      - name: Run tests
        run: bun run test

      - name: Deploy Convex
        working-directory: evalScores
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        # The strict shared-table schema replaces the legacy coding-only indexes
        # after their kind-prefixed equivalents have already been backfilled.
        run: bunx convex deploy --allow-deleting-large-indexes
