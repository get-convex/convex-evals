name: Periodic Evaluations

on:
  schedule:
    - cron: "0 */4 * * *" # Run every 4 hours
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: read

# A catch-up pass can outlast the 4-hour cron. Queue the next pass instead of
# overlapping it, so models that have not started yet are not dispatched twice.
concurrency:
  group: periodic-evals
  cancel-in-progress: false

jobs:
  setup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-models.outputs.matrix }}
      has_models: ${{ steps.set-models.outputs.has_models }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Bun
        run: npm install -g bun@1.3.8
      - name: Install dependencies
        run: bun install --frozen-lockfile
      # Web runs are included when ENABLE_NO_GUIDELINES_WITH_WEB is true.
      - id: set-experiments
        env:
          ENABLE_WEB: ${{ vars.ENABLE_NO_GUIDELINES_WITH_WEB }}
        run: |
          if [ "$ENABLE_WEB" = "true" ]; then
            echo 'experiments=["default","no_guidelines","no_guidelines_with_web"]' >> "$GITHUB_OUTPUT"
          else
            echo 'experiments=["default","no_guidelines"]' >> "$GITHUB_OUTPUT"
          fi
      - id: set-models
        env:
          CONVEX_EVAL_URL: ${{ secrets.CONVEX_EVAL_URL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EXPERIMENTS: ${{ steps.set-experiments.outputs.experiments }}
        run: |
          bun run scripts/listPeriodicModels.ts --format json --experiments "$EXPERIMENTS" --output-file /tmp/periodic-matrix.json
          matrix=$(< /tmp/periodic-matrix.json)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" = '{"include":[]}' ]; then
            echo "has_models=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_models=true" >> "$GITHUB_OUTPUT"
          fi

  run-evals:
    needs: setup
    if: needs.setup.outputs.has_models == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}

    env:
      ENVIRONMENT: ci
      GITHUB_TOKEN: ${{ github.token }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      # Model IDs can come from OpenRouter's rankings. Set here, not in a run
      # script or $GITHUB_ENV, so they are never parsed as shell or extra
      # environment variables.
      MODELS: ${{ matrix.model }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Model-written code runs in this job, and nothing here needs git
          # credentials after checkout, so keep the job token out of
          # .git/config. This removes one copy only: GITHUB_TOKEN is still in
          # the job env because the runner uses it for GitHub API calls.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Bun
        run: npm install -g bun@1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Create temp directory
        run: mkdir -p /tmp/convex-evals

      - name: Set main-branch-only environment variables
        if: github.ref == 'refs/heads/main'
        env:
          CONVEX_EVAL_URL: ${{ secrets.CONVEX_EVAL_URL }}
          CONVEX_AUTH_TOKEN: ${{ secrets.CONVEX_AUTH_TOKEN }}
        run: |
          printf 'CONVEX_EVAL_URL=%s\n' "$CONVEX_EVAL_URL" >> "$GITHUB_ENV"
          printf 'CONVEX_AUTH_TOKEN=%s\n' "$CONVEX_AUTH_TOKEN" >> "$GITHUB_ENV"

      - name: Run evaluations
        env:
          OUTPUT_TEMPDIR: /tmp/convex-evals
          EVAL_CONDITION: ${{ matrix.experiment }}
          ENABLE_CLIENT_WEB_PRODUCTION: ${{ vars.ENABLE_CLIENT_WEB_PRODUCTION }}
          EXA_API_KEY: ${{ matrix.experiment == 'no_guidelines_with_web' && secrets.EXA_API_KEY || '' }}
        run: |
          # An empty experiment string is not a valid stored experiment label.
          if [ "$EVAL_CONDITION" = "default" ]; then
            unset EVALS_EXPERIMENT
          else
            export EVALS_EXPERIMENT="$EVAL_CONDITION"
          fi
          if [ "$EVAL_CONDITION" = "no_guidelines_with_web" ]; then
            export CLIENT_WEB_TOOLS=1
          fi
          bun run runner/index.ts

      - name: Preserve web research traces
        if: ${{ always() && matrix.experiment == 'no_guidelines_with_web' }}
        uses: actions/upload-artifact@v4
        with:
          name: web-research-${{ strategy.job-index }}
          path: /tmp/convex-evals/research
          if-no-files-found: warn
          retention-days: 30
