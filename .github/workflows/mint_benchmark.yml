name: Mint Benchmark Version

on:
  workflow_dispatch:
    inputs:
      kind:
        description: Benchmark kind to publish (does not run models)
        required: true
        type: choice
        options:
          - coding
          - decision

permissions:
  contents: read

jobs:
  mint:
    # Benchmark versions should describe code that has already landed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Bun
        run: npm install -g bun@1.3.8

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Mint current benchmark version
        env:
          BENCHMARK_KIND: ${{ inputs.kind }}
          CONVEX_EVAL_URL: ${{ secrets.CONVEX_EVAL_URL }}
          CONVEX_AUTH_TOKEN: ${{ secrets.CONVEX_AUTH_TOKEN }}
        run: bun run benchmark:mint

      - name: Preserve decision source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-source
          path: output-benchmark-mint/
          if-no-files-found: warn
          retention-days: 30
